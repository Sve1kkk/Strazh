name: Выпустить обновление

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Новая версия (например 1.2.0) — должна быть больше прошлой"
        required: true
      notes:
        description: "Что нового (увидят пользователи)"
        required: false
        default: "Исправления и улучшения"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Прописать номер версии
        shell: pwsh
        env:
          VER: ${{ inputs.version }}
        run: |
          if ($env:VER -notmatch '^\d+(\.\d+){1,3}$') { throw "Версия должна быть вида 1.2.0" }
          $src = Get-Content antivirus.py -Raw -Encoding utf8
          $src = $src -replace 'APP_VERSION = "[^"]*"', "APP_VERSION = `"$env:VER`""
          [IO.File]::WriteAllText("$PWD\antivirus.py", $src, (New-Object Text.UTF8Encoding $false))
          python -m py_compile antivirus.py

      - name: Собрать Strazh.exe
        run: |
          python -m pip install --upgrade pip
          python -m pip install psutil pystray pillow pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --uac-admin --name Strazh --icon icon.ico --add-data "icon.ico;." --hidden-import pystray._win32 antivirus.py

      - name: Контрольные суммы
        shell: pwsh
        run: |
          Copy-Item dist\Strazh.exe .
          $lines = foreach ($f in 'Strazh.exe', 'antivirus.py') {
            "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $f"
          }
          [IO.File]::WriteAllLines("$PWD\SHA256SUMS.txt", [string[]]$lines)
          Get-Content SHA256SUMS.txt

      - name: Опубликовать релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "v$env:VER" Strazh.exe antivirus.py SHA256SUMS.txt --title "Страж $env:VER" --notes "$env:NOTES"
